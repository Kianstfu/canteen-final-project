<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen — create account</title>
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/icon-192.png">
<link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --maroon: #1E3A5F;
  --maroon-dark: #0B1626;
  --mustard: #2DD4BF;
  --mustard-dark: #14B8A6;
  --cream: #0B1626;
  --card: #16283F;
  --text: #E8F1F8;
  --muted: #7C93AC;
  --border: #24425F;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(180deg, var(--cream) 0%, #0F2038 100%);
  color: var(--text);
  min-height: 100vh;
}
.font-display { font-family: 'DM Serif Display', Georgia, serif; }
.card-dark {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  box-shadow: 0 8px 28px rgba(45,212,191,0.15), 0 4px 14px rgba(0,0,0,0.35);
}
.icon-circle {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(150deg, var(--mustard), var(--mustard-dark));
  color: var(--maroon-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
}
.form-control-dark { background: #F0F6FB; color: #16283F; border: 1px solid var(--border); }
.form-control-dark:focus { background: #F0F6FB; color: #16283F; border-color: var(--mustard); box-shadow: 0 0 0 0.25rem rgba(45,212,191,0.15); }
.form-label-dark { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.btn-teal { background: linear-gradient(150deg, var(--mustard), var(--mustard-dark)); color: var(--maroon-dark); font-weight: 700; border: none; }
.btn-teal:hover { filter: brightness(1.1); color: var(--maroon-dark); }
.link-muted { color: var(--muted); text-decoration: none; }
.link-teal { color: var(--mustard); font-weight: 600; text-decoration: none; }
</style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4">
      <div class="card-dark p-4">
        <div class="icon-circle mx-auto mb-3">🧑‍🎓</div>
        <h2 class="font-display text-center mb-1">Create account</h2>
        <p class="text-center mb-4" style="color:var(--muted); font-size:0.85rem;">So we can track your orders</p>

        <div class="alert alert-danger py-2 px-3 small" id="errorMsg" style="display:none;"></div>

        <form id="registerForm">
          <div class="mb-3">
            <label for="fullName" class="form-label-dark form-label">Full name</label>
            <input id="fullName" type="text" class="form-control form-control-dark" required>
          </div>
          <div class="mb-3">
            <label for="username" class="form-label-dark form-label">Username</label>
            <input id="username" type="text" class="form-control form-control-dark" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="contact" class="form-label-dark form-label">Contact number (optional)</label>
            <input id="contact" type="tel" class="form-control form-control-dark" placeholder="09XX XXX XXXX">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label-dark form-label">Password</label>
            <input id="password" type="password" class="form-control form-control-dark" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-teal w-100" id="registerBtn">Create account</button>
        </form>

        <a href="customer-login.html" class="link-teal d-block text-center mt-3 small">Already have an account? Log in →</a>
        <a href="0-landing.html" class="link-muted d-block text-center mt-2 small">← Back</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const btn = document.getElementById('registerBtn');
  const errorMsg = document.getElementById('errorMsg');
  btn.disabled = true;
  btn.textContent = 'Creating account...';
  errorMsg.style.display = 'none';

  try {
    const res = await fetch('/api/customer/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: document.getElementById('fullName').value,
        username: document.getElementById('username').value,
        contact_number: document.getElementById('contact').value,
        password: document.getElementById('password').value
      })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      errorMsg.textContent = data.message || 'Account could not be created.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create account';
      return;
    }

    alert('Success! Please log in using your new account.');
    window.location.href = 'customer-login.html';

  } catch (err) {
    errorMsg.textContent = 'Connection problem. Make sure the server is running.';
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});
</script>

<script src="/register-sw.js" defer></script>
</body>
</html>
