<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen — delivery details</title>
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/icon-192.png">
<link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --maroon: #1E3A5F;
  --maroon-dark: #0B1626;
  --mustard: #2DD4BF;
  --mustard-dark: #14B8A6;
  --cream: #0B1626;
  --card: #16283F;
  --text: #E8F1F8;
  --muted: #7C93AC;
  --border: #24425F;
}
body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(180deg, var(--cream) 0%, #0F2038 100%); color: var(--text); }
.font-display { font-family: 'DM Serif Display', Georgia, serif; }
.navbar-dark-custom { background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%); box-shadow: 0 8px 28px rgba(45,212,191,0.15), 0 4px 14px rgba(0,0,0,0.35); }
.icon-badge { width: 36px; height: 36px; border-radius: 50%; background: var(--mustard); color: var(--maroon-dark); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
.card-dark { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; }
.form-control-dark, .form-select-dark { background: #F0F6FB; color: #16283F; border: 1px solid var(--border); }
.form-control-dark:focus, .form-select-dark:focus { background: #F0F6FB; color: #16283F; border-color: var(--mustard); box-shadow: 0 0 0 0.25rem rgba(45,212,191,0.15); }
.form-label-dark { color: var(--muted); font-size: 0.82rem; font-weight: 600; }

.option-btn { border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; background: #fff; color: #16283F; }
.option-btn.selected-building { border-color: var(--mustard); background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%); color: #fff; }
.option-btn.selected-pay { border-color: var(--mustard-dark); background: #FBF1DD; color: #16283F; }

.btn-teal { background: linear-gradient(150deg, var(--mustard), var(--mustard-dark)); color: var(--maroon-dark); font-weight: 700; border: none; }
.btn-teal:hover { filter: brightness(1.1); color: var(--maroon-dark); }
.btn-teal:disabled { opacity: 0.6; }
</style>
</head>
<body>
<script>
if (sessionStorage.getItem("customer_logged_in") !== "true") {
  window.location.href = "customer-login.html";
}
</script>

<nav class="navbar navbar-dark-custom py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="d-flex align-items-center gap-2 font-display fs-4 text-white">
      <span class="icon-badge">🍴</span> Canteen Order
    </span>
    <a href="cart.html" class="text-white-50 small text-decoration-none">← Back to cart</a>
  </div>
</nav>

<div class="container py-4 pb-5" style="max-width:520px;">
  <h2 class="font-display mb-1">Where should we deliver this?</h2>
  <p class="mb-4 small" style="color:var(--muted);">Confirm your delivery details and we'll bring your order over.</p>

  <form id="checkoutForm">
    <div class="card-dark p-4 mb-3">

      <div class="mb-3">
        <label for="name" class="form-label-dark form-label">Your name</label>
        <input id="name" name="customer_name" type="text" class="form-control form-control-dark" placeholder="e.g. Juan Dela Cruz" required>
      </div>

      <label class="form-label-dark form-label">Building</label>
      <div class="row g-2 mb-3" id="buildingGrid">
        <div class="col-4"><div class="option-btn selected-building py-2" data-val="Darius">Darius</div></div>
        <div class="col-4"><div class="option-btn py-2" data-val="Kate">Kate</div></div>
        <div class="col-4"><div class="option-btn py-2" data-val="Nelrose">Nelrose</div></div>
      </div>

      <div class="mb-3">
        <label for="room" class="form-label-dark form-label">Room number</label>
        <input id="room" name="room_number" type="text" class="form-control form-control-dark" placeholder="e.g. Room 204" required>
      </div>

      <div class="mb-3">
        <label for="contact" class="form-label-dark form-label">Contact number (optional)</label>
        <input id="contact" name="contact_number" type="tel" class="form-control form-control-dark" placeholder="09XX XXX XXXX">
      </div>

      <div class="mb-3">
        <label for="notes" class="form-label-dark form-label">Notes for the canteen (optional)</label>
        <textarea id="notes" name="notes" rows="2" class="form-control form-control-dark" placeholder="e.g. less rice, no ice"></textarea>
      </div>

      <label class="form-label-dark form-label">Payment method</label>
      <div class="option-btn selected-pay py-2 mb-2" style="cursor:default;">💵 Cash on delivery</div>
    </div>

    <div class="card-dark p-3" id="summaryCard"></div>

    <button type="submit" class="btn btn-teal w-100 mt-4 py-2" id="placeOrderBtn">Place order</button>
    <div class="alert alert-danger mt-2 py-2 px-3 small" id="errorMsg" style="display:none;"></div>
  </form>
</div>

<script>
function getCart() {
  return JSON.parse(localStorage.getItem('canteen_cart') || '[]');
}

let selectedBuilding = 'Darius';
let selectedPayment = 'Cash on delivery';

document.querySelectorAll('#buildingGrid .option-btn').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('#buildingGrid .option-btn').forEach(o => o.classList.remove('selected-building'));
    this.classList.add('selected-building');
    selectedBuilding = this.dataset.val;
  });
});

function renderSummary() {
  const cart = getCart();
  const summaryCard = document.getElementById('summaryCard');

  if (cart.length === 0) {
    summaryCard.innerHTML = '<p class="small mb-0" style="color:var(--muted);">Your cart is empty. <a href="1-menu.html" style="color:var(--maroon); font-weight:600;">Back to menu →</a></p>';
    document.getElementById('placeOrderBtn').disabled = true;
    return;
  }

  const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
  summaryCard.innerHTML = cart.map(i => `
    <div class="d-flex justify-content-between small py-1"><span style="color:var(--muted);">${i.name} x${i.quantity}</span><span>₱${i.price * i.quantity}</span></div>
  `).join('') + `<div class="d-flex justify-content-between fw-bold border-top py-2 mt-1" style="border-color:var(--border) !important; font-size:1.1rem;"><span>Total</span><span>₱${total}</span></div>`;
}

document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const cart = getCart();
  if (cart.length === 0) return;

  const btn = document.getElementById('placeOrderBtn');
  const errorMsg = document.getElementById('errorMsg');
  btn.disabled = true;
  btn.textContent = 'Placing order...';
  errorMsg.style.display = 'none';

  const orderData = {
    customer_id: sessionStorage.getItem('customer_id') || null,
    customer_name: document.getElementById('name').value,
    building: selectedBuilding,
    room_number: document.getElementById('room').value,
    contact_number: document.getElementById('contact').value,
    notes: document.getElementById('notes').value,
    payment_method: selectedPayment,
    items: cart.map(i => ({ item_id: i.item_id, quantity: i.quantity, price: i.price }))
  };

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    });

    if (!res.ok) throw new Error('Order could not be saved. Please try again.');

    const result = await res.json();

    sessionStorage.setItem('last_order', JSON.stringify({
      order_id: result.order_id,
      total: result.total_amount,
      building: selectedBuilding,
      room: document.getElementById('room').value,
      payment: selectedPayment,
      items: cart
    }));

    localStorage.removeItem('canteen_cart');
    window.location.href = '4-order-confirmation.html';

  } catch (err) {
    errorMsg.textContent = err.message || 'There was a problem saving your order. Make sure the server is running.';
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Place order';
  }
});

renderSummary();
</script>

<script src="/register-sw.js" defer></script>
</body>
</html>
